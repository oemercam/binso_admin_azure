User clamav
Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 0660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 127.0.0.1
MaxThreads 2
MaxQueue 6
StreamMaxLength 10M
# ZIP extraction can truncate silently at MaxFileSize. Keep that ceiling above
# the aggregate budget, so even a truncated entry exceeds MaxScanSize and alerts.
MaxFileSize 20M
MaxScanSize 10M
MaxScanTime 10000
MaxRecursion 16
MaxFiles 10000
ReadTimeout 15
CommandReadTimeout 5
BytecodeTimeout 5000
ScanPDF yes
ScanArchive yes
ScanOLE2 yes
ScanHTML yes
AlertExceedsMax yes
AlertEncrypted yes
LogClean no
LogTime yes
LogVerbose no
ConcurrentDatabaseReload yes
