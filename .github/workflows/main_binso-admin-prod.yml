name: Build and deploy Binso One to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: binso-one-production
  cancel-in-progress: false

jobs:
  build:
    name: Quality, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build metadata
        shell: bash
        run: |
          echo "NEXT_PUBLIC_BUILD_ID=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_ENV=production" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Product checks
        run: pnpm run architecture:check && pnpm run actions:check && pnpm run process:check && pnpm run mobile-ui:check && pnpm run saas:check && pnpm run data-foundation:check && pnpm run auth-membership:check && pnpm run customer-auth:check && pnpm run registration-onboarding:check && pnpm run subscription-billing:check && pnpm run stripe-payment:check && pnpm run saas:product-check && pnpm run platform:check && pnpm run go-live:check

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Prepare standalone deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          if [ -d .next/static ]; then cp -a .next/static .next/standalone/.next/static; fi
          if [ -d public ]; then cp -a public .next/standalone/public; fi

          SWC_HELPERS_DIR="$(node -p "require('path').dirname(require.resolve('@swc/helpers/package.json'))")"
          rm -rf .next/standalone/node_modules/@swc/helpers
          mkdir -p .next/standalone/node_modules/@swc
          cp -aL "$SWC_HELPERS_DIR" .next/standalone/node_modules/@swc/helpers

          test -f .next/standalone/node_modules/@swc/helpers/esm/_interop_require_default.js
          test -f .next/standalone/node_modules/@swc/helpers/cjs/_interop_require_default.cjs

      - name: Materialize standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-root
          mkdir -p deploy-root

          # Azure ZipDeploy/OneDeploy does not reliably preserve pnpm symlinks.
          # Dereference every symlink so node_modules contains physical files/directories.
          cp -aL .next/standalone/. deploy-root/

          test -f deploy-root/server.js
          test -d deploy-root/node_modules/next
          test ! -L deploy-root/node_modules/next
          test -f deploy-root/node_modules/next/package.json
          test -d deploy-root/node_modules/@swc/helpers
          test ! -L deploy-root/node_modules/@swc/helpers
          test -f deploy-root/node_modules/@swc/helpers/esm/_interop_require_default.js
          test -f deploy-root/node_modules/@swc/helpers/cjs/_interop_require_default.cjs

      - name: Verify isolated standalone runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          (
            cd deploy-root
            node -e "console.log(require.resolve('@swc/helpers/_/_interop_require_default'))"
            node -e "require('next/dist/shared/lib/constants'); console.log('Next runtime dependency check passed')"
            node -e "const fs=require('fs'); const s=fs.lstatSync('node_modules/next'); if (!s.isDirectory() || s.isSymbolicLink()) process.exit(1); console.log('Next package is materialized')"
          )

      - name: Create immutable deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f binso-one.zip
          (
            cd deploy-root
            zip -qry "$GITHUB_WORKSPACE/binso-one.zip" .
          )
          unzip -l binso-one.zip | grep -F 'node_modules/next/package.json'
          unzip -l binso-one.zip | grep -F 'node_modules/@swc/helpers/esm/_interop_require_default.js'
          unzip -l binso-one.zip | grep -F 'server.js'

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: binso-one
          path: binso-one.zip
          if-no-files-found: error
          retention-days: 1

  migrate:
    name: Migrate production database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build, migrate]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v7
        with:
          name: binso-one
          path: deploy

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_26AFEFB731284F009ED9276FD775F286 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2CCE2EB4F39347B98167444DC3298211 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_062EB98486644201BBC1D99AE3FDD2FC }}

      - name: Resolve Azure resource group
        id: app
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="$(az webapp list --query "[?name=='binso-admin-prod'].resourceGroup | [0]" -o tsv)"
          test -n "$RESOURCE_GROUP"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Disable App Service build automation
        shell: bash
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              BUILD_FLAGS=Off \
            --output none

      - name: Set explicit standalone startup command
        shell: bash
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --startup-file "node server.js" \
            --output none

      - name: Deploy clean prebuilt ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/binso-one.zip
          az webapp deploy \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --src-path deploy/binso-one.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --output json

      - name: Verify production health
        shell: bash
        env:
          BASE_URL: ${{ vars.BINSO_ONE_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP $STATUS"
            sleep 10
          done
          echo "Production health check failed"
          cat /tmp/health.json 2>/dev/null || true
          exit 1
