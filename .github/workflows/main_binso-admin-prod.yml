name: Build and deploy Binso One to Azure

on:
  push:
    branches: [main, v69-production-completion]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Production-Migration und Deployment ausdrücklich freigeben'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'binso-one-production' || format('binso-one-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  database-test:
    if: github.event_name != 'workflow_dispatch'
    name: Isolated PostgreSQL migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: binso_v69_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile
          echo "DB_INSTALL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Apply and repeat migrations
        shell: bash
        run: |
          START=$(date +%s)
          pnpm db:migrate
          pnpm db:migrate
          pnpm run test:integration:db
          echo "DB_TEST_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/binso_v69_test
          PLATFORM_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/binso_v69_test
          DATABASE_TEST_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/binso_v69_test
          DATABASE_SSL: 'false'
      - name: Database performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '### PostgreSQL CI performance'
            echo '| Metric | Seconds |'
            echo '| --- | ---: |'
            echo "| Dependency install | ${DB_INSTALL_SECONDS:-n/a} |"
            echo "| Migration + RLS test | ${DB_TEST_SECONDS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    if: github.event_name != 'workflow_dispatch'
    name: Quality and regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile
          echo "QUALITY_INSTALL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Typecheck
        shell: bash
        run: |
          START=$(date +%s)
          pnpm typecheck
          echo "TYPECHECK_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Lint
        shell: bash
        run: |
          START=$(date +%s)
          pnpm lint
          echo "LINT_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Product checks
        shell: bash
        run: |
          START=$(date +%s)
          pnpm run security:check
          pnpm run architecture:check
          pnpm run consistency:check
          pnpm run design-system:check
          pnpm run actions:check
          pnpm run process:check
          pnpm run mobile-ui:check
          pnpm run product:simplicity-check
          pnpm run saas:check
          pnpm run multitenant:check
          pnpm run data-foundation:check
          pnpm run auth-membership:check
          pnpm run customer-auth:check
          pnpm run registration-onboarding:check
          pnpm run subscription-billing:check
          pnpm run stripe-payment:check
          pnpm run saas:product-check
          pnpm run platform:check
          pnpm run go-live:check
          pnpm run platform-foundation:check
          pnpm run v74:check
          pnpm run v75:check
          pnpm run v76:check
          pnpm run v77:check
          pnpm run v78:check
          pnpm run v79:check
          pnpm run v80:check
          pnpm run v819:check
          pnpm run v8110:check
          pnpm run v8111:check
          pnpm run v81.12:check
          pnpm run v81.13:check
          pnpm run v81.14:check
          pnpm run v81.15:check
          pnpm run v81.16:check
          pnpm run v81.16.2:check
          pnpm run v81.16.3:check
          pnpm run v81.16.4:check
          pnpm run v81.16.5:check
          pnpm run v81.17:check
          pnpm run v81.17.1:check
          pnpm run v81.17.2:check
          pnpm run v81.18:check
          pnpm run v81.19:check
          pnpm run v81.19.1:check
          pnpm run v81.19.2:check
          pnpm run v81.19.3:check
          pnpm run v81.19.4:check
          pnpm run language:check
          echo "PRODUCT_CHECK_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Behavioral regression tests
        shell: bash
        run: |
          START=$(date +%s)
          pnpm test
          echo "REGRESSION_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Quality performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Quality CI performance'
            echo '| Metric | Seconds |'
            echo '| --- | ---: |'
            echo "| Dependency install | ${QUALITY_INSTALL_SECONDS:-n/a} |"
            echo "| Typecheck | ${TYPECHECK_SECONDS:-n/a} |"
            echo "| Lint | ${LINT_SECONDS:-n/a} |"
            echo "| Product checks | ${PRODUCT_CHECK_SECONDS:-n/a} |"
            echo "| Regression tests | ${REGRESSION_SECONDS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name != 'workflow_dispatch'
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile
          echo "BUILD_INSTALL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'modules/**/*', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Set build metadata
        shell: bash
        run: |
          echo "NEXT_PUBLIC_BUILD_ID=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_ENV=production" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          START=$(date +%s)
          pnpm build
          echo "BUILD_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Materialize complete standalone runtime
        shell: bash
        run: |
          START=$(date +%s)
          pnpm deployment:prepare deploy-root
          echo "STANDALONE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Verify isolated standalone runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          (
            cd deploy-root
            node -e "console.log(require.resolve('@swc/helpers/_/_interop_require_default'))"
            node -e "require('next/dist/shared/lib/constants'); console.log('Next runtime dependency check passed')"
            node -e "const fs=require('fs'); const s=fs.lstatSync('node_modules/next'); if (!s.isDirectory() || s.isSymbolicLink()) process.exit(1); console.log('Next package is materialized')"
          )
      - name: Create immutable deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          rm -f binso-one.zip
          (
            cd deploy-root
            zip -qry "$GITHUB_WORKSPACE/binso-one.zip" .
          )
          unzip -l binso-one.zip | grep -F 'node_modules/next/package.json'
          unzip -l binso-one.zip | grep -F 'node_modules/@swc/helpers/esm/_interop_require_default.js'
          unzip -l binso-one.zip | grep -F 'server.js'
          echo "PACKAGE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          echo "DEPLOY_ROOT_BYTES=$(du -sb deploy-root | cut -f1)" >> "$GITHUB_ENV"
          echo "DEPLOY_ZIP_BYTES=$(stat -c%s binso-one.zip)" >> "$GITHUB_ENV"
      - name: Smoke test isolated artifact
        shell: bash
        run: |
          START=$(date +%s)
          node scripts/smoke-standalone.mjs deploy-root
          echo "SMOKE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Create deployment artifact metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum binso-one.zip > binso-one.zip.sha256
          printf '{"commitSha":"%s","buildId":"%s","sourceRunId":"%s"}\n' \
            "$GITHUB_SHA" "${GITHUB_SHA::12}" "$GITHUB_RUN_ID" > artifact-metadata.json
      - name: Upload deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: binso-one
          path: |
            binso-one.zip
            binso-one.zip.sha256
            artifact-metadata.json
          if-no-files-found: error
          retention-days: 2
      - name: Build performance summary
        if: always()
        shell: bash
        run: |
          mib() { awk -v b="${1:-0}" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          {
            echo '### Build and artifact performance'
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Dependency install | ${BUILD_INSTALL_SECONDS:-n/a} s |"
            echo "| Next.js build | ${BUILD_SECONDS:-n/a} s |"
            echo "| Standalone materialization | ${STANDALONE_SECONDS:-n/a} s |"
            echo "| ZIP packaging | ${PACKAGE_SECONDS:-n/a} s |"
            echo "| Artifact smoke test | ${SMOKE_SECONDS:-n/a} s |"
            echo "| Standalone size | $(mib "${DEPLOY_ROOT_BYTES:-0}") MiB |"
            echo "| Deployment ZIP size | $(mib "${DEPLOY_ZIP_BYTES:-0}") MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    if: github.event_name != 'workflow_dispatch'
    name: Critical E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile
          echo "E2E_INSTALL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.51.1
      - name: Install Playwright system dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm exec playwright install-deps chromium
          echo "PLAYWRIGHT_DEPS_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          START=$(date +%s)
          pnpm exec playwright install chromium
          echo "PLAYWRIGHT_BROWSER_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Run critical E2E
        shell: bash
        run: |
          START=$(date +%s)
          pnpm test:e2e --project=desktop-chromium
          echo "E2E_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
        env:
          AUTH_MODE: local
          ALLOW_LOCAL_AUTH: 'true'
          DATABASE_URL: ''
          NEXT_PUBLIC_APP_ENV: e2e
      - name: E2E performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '### E2E performance'
            echo '| Metric | Seconds |'
            echo '| --- | ---: |'
            echo "| Dependency install | ${E2E_INSTALL_SECONDS:-n/a} |"
            echo "| Playwright system dependencies | ${PLAYWRIGHT_DEPS_SECONDS:-n/a} |"
            echo "| Chromium download | ${PLAYWRIGHT_BROWSER_SECONDS:-cache-hit} |"
            echo "| Critical E2E | ${E2E_SECONDS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"


  validated-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    name: Reuse validated push artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Resolve successful push run for exact commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/main_binso-admin-prod.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=20 \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful push CI run exists for exact commit $GITHUB_SHA."
            echo "Run the normal push CI successfully before Production deployment."
            exit 1
          fi
          echo "Using validated push run $RUN_ID for commit $GITHUB_SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download validated immutable artifact
        uses: actions/download-artifact@v8
        with:
          name: binso-one
          path: validated-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify artifact commit and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f validated-artifact/binso-one.zip
          test -f validated-artifact/binso-one.zip.sha256
          test -f validated-artifact/artifact-metadata.json
          test "$(jq -r '.commitSha' validated-artifact/artifact-metadata.json)" = "$GITHUB_SHA"
          (
            cd validated-artifact
            sha256sum -c binso-one.zip.sha256
          )
          echo "Validated immutable artifact from push run ${{ steps.source.outputs.run_id }}."
      - name: Artifact reuse summary
        shell: bash
        run: |
          SIZE="$(stat -c%s validated-artifact/binso-one.zip)"
          MIB="$(awk -v b="$SIZE" 'BEGIN { printf "%.1f", b / 1048576 }')"
          {
            echo '### Production artifact reuse'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Validated push run: \`${{ steps.source.outputs.run_id }}\`"
            echo "- Artifact size: ${MIB} MiB"
            echo '- Build, Quality, PostgreSQL CI and E2E are not repeated in the manual deployment run.'
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    name: Migrate production database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [validated-artifact]
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install production migration dependencies
        shell: bash
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile --prod
          echo "MIGRATE_INSTALL_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Apply database migrations
        shell: bash
        run: |
          START=$(date +%s)
          pnpm db:migrate
          echo "MIGRATE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL || secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'
      - name: Migration performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Production migration performance'
            echo '| Metric | Seconds |'
            echo '| --- | ---: |'
            echo "| Production-only dependency install | ${MIGRATE_INSTALL_SECONDS:-n/a} |"
            echo "| Database migration | ${MIGRATE_SECONDS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [validated-artifact, migrate]
    environment: production
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download validated deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: binso-one
          path: deploy
          github-token: ${{ github.token }}
          run-id: ${{ needs.validated-artifact.outputs.source_run_id }}
      - name: Re-verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.commitSha' deploy/artifact-metadata.json)" = "$GITHUB_SHA"
          (
            cd deploy
            sha256sum -c binso-one.zip.sha256
          )
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_26AFEFB731284F009ED9276FD775F286 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2CCE2EB4F39347B98167444DC3298211 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_062EB98486644201BBC1D99AE3FDD2FC }}
      - name: Resolve Azure resource group
        id: app
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="$(az webapp list --query "[?name=='binso-admin-prod'].resourceGroup | [0]" -o tsv)"
          test -n "$RESOURCE_GROUP"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
      - name: Ensure staging slot exists
        shell: bash
        env:
          STAGING_URL: ${{ vars.BINSO_ONE_STAGING_URL }}
        run: |
          set -euo pipefail
          SLOT="${{ vars.BINSO_ONE_STAGING_SLOT || 'staging' }}"
          FOUND="$(az webapp deployment slot list --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod --query "[?name=='$SLOT'].name | [0]" -o tsv)"
          if [ "$FOUND" != "$SLOT" ]; then
            echo "Creating staging slot '$SLOT' by cloning Production configuration."
            az webapp deployment slot create \
              --resource-group "${{ steps.app.outputs.resource_group }}" \
              --name binso-admin-prod \
              --slot "$SLOT" \
              --configuration-source binso-admin-prod \
              --output none
          fi
          test -n "$STAGING_URL"
          echo "STAGING_SLOT=$SLOT" >> "$GITHUB_ENV"
      - name: Sync missing staging runtime settings
        shell: bash
        run: |
          set -euo pipefail
          PROD_JSON="$(az webapp config appsettings list --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod -o json)"
          STAGING_JSON="$(az webapp config appsettings list --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod --slot "$STAGING_SLOT" -o json)"
          REQUIRED=(DATABASE_URL DATABASE_SSL AUTH_MODE AUTH_PROVIDER_NAME INTERNAL_JOB_SECRET)
          OPTIONAL=(AUTH_ADMIN_PROVIDER_NAME EMAIL_DELIVERY_MODE GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET GRAPH_SENDER_USER_ID STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_STARTER STRIPE_PRICE_BUSINESS STRIPE_PRICE_PROFESSIONAL STRIPE_PRICE_ENTERPRISE PUSH_SUBSCRIPTION_ENCRYPTION_KEY PLATFORM_DATABASE_URL PLATFORM_ROLE_SOURCE BINSO_OPERATOR_HOST BINSO_PUBLIC_HOST)
          sync_if_missing() {
            local KEY="$1"
            local MUST="$2"
            local CURRENT
            local PROD
            CURRENT="$(jq -r --arg key "$KEY" '.[] | select(.name==$key) | .value' <<<"$STAGING_JSON" | head -n1)"
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "null" ]; then return 0; fi
            PROD="$(jq -r --arg key "$KEY" '.[] | select(.name==$key) | .value' <<<"$PROD_JSON" | head -n1)"
            if [ -z "$PROD" ] || [ "$PROD" = "null" ]; then
              if [ "$MUST" = "required" ]; then echo "Required Production setting '$KEY' is missing."; exit 1; fi
              return 0
            fi
            echo "Syncing missing staging setting: $KEY"
            az webapp config appsettings set --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod --slot "$STAGING_SLOT" --settings "$KEY=$PROD" --output none
            STAGING_JSON="$(az webapp config appsettings list --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod --slot "$STAGING_SLOT" -o json)"
          }
          for KEY in "${REQUIRED[@]}"; do sync_if_missing "$KEY" required; done
          for KEY in "${OPTIONAL[@]}"; do sync_if_missing "$KEY" optional; done
      - name: Configure and validate staging slot runtime
        shell: bash
        env:
          STAGING_URL: ${{ vars.BINSO_ONE_STAGING_URL }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --slot "$STAGING_SLOT" \
            --settings WEBSITE_RUN_FROM_PACKAGE=1 SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false BUILD_FLAGS=Off \
            --output none
          az webapp config appsettings set \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --slot "$STAGING_SLOT" \
            --slot-settings APP_BASE_URL="$STAGING_URL" \
            --output none
          az webapp config set \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --slot "$STAGING_SLOT" \
            --linux-fx-version 'NODE|24-lts' \
            --always-on true \
            --startup-file "node server.js" \
            --output none
          NAMES="$(az webapp config appsettings list --resource-group "${{ steps.app.outputs.resource_group }}" --name binso-admin-prod --slot "$STAGING_SLOT" --query '[].name' -o tsv)"
          for REQUIRED in DATABASE_URL DATABASE_SSL AUTH_MODE APP_BASE_URL INTERNAL_JOB_SECRET; do
            echo "$NAMES" | grep -Fxq "$REQUIRED" || { echo "Required staging setting '$REQUIRED' is missing."; exit 1; }
          done
      - name: Deploy immutable artifact to staging slot
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          test -f deploy/binso-one.zip
          az webapp deploy \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --slot "$STAGING_SLOT" \
            --src-path deploy/binso-one.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --output json
          echo "AZURE_DEPLOY_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Verify staging health and smoke
        shell: bash
        env:
          STAGING_URL: ${{ vars.BINSO_ONE_STAGING_URL }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          node scripts/smoke-url.mjs "$STAGING_URL"
          echo "STAGING_SMOKE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Record healthy staging release
        continue-on-error: true
        shell: bash
        env:
          STAGING_URL: ${{ vars.BINSO_ONE_STAGING_URL }}
          JOB_SECRET: ${{ secrets.BINSO_ONE_INTERNAL_JOB_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "${STAGING_URL%/}/api/internal/release-event" \
            -H "Authorization: Bearer $JOB_SECRET" -H 'Content-Type: application/json' \
            --data "{\"buildId\":\"${GITHUB_SHA::12}\",\"environment\":\"staging\",\"status\":\"healthy\",\"commitSha\":\"$GITHUB_SHA\"}"
      - name: Swap validated staging slot to production
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          az webapp deployment slot swap \
            --resource-group "${{ steps.app.outputs.resource_group }}" \
            --name binso-admin-prod \
            --slot "$STAGING_SLOT" \
            --target-slot production \
            --output none
          echo "SLOT_SWAP_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: Verify production health or rollback swap
        shell: bash
        env:
          BASE_URL: ${{ vars.BINSO_ONE_BASE_URL }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          test -n "$BASE_URL"
          HEALTHY=false
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.json
              HEALTHY=true
              break
            fi
            echo "Production health check attempt $attempt returned HTTP $STATUS"
            sleep 10
          done
          echo "PRODUCTION_HEALTH_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          if [ "$HEALTHY" != "true" ]; then
            echo "Production health failed after swap. Rolling back to previous slot content."
            az webapp deployment slot swap \
              --resource-group "${{ steps.app.outputs.resource_group }}" \
              --name binso-admin-prod \
              --slot "$STAGING_SLOT" \
              --target-slot production \
              --output none
            exit 1
          fi
      - name: Record healthy production release
        continue-on-error: true
        shell: bash
        env:
          BASE_URL: ${{ vars.BINSO_ONE_BASE_URL }}
          JOB_SECRET: ${{ secrets.BINSO_ONE_INTERNAL_JOB_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "${BASE_URL%/}/api/internal/release-event" \
            -H "Authorization: Bearer $JOB_SECRET" -H 'Content-Type: application/json' \
            --data "{\"buildId\":\"${GITHUB_SHA::12}\",\"environment\":\"production\",\"status\":\"healthy\",\"commitSha\":\"$GITHUB_SHA\"}"
      - name: Deployment performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Azure deployment performance'
            echo '| Metric | Seconds |'
            echo '| --- | ---: |'
            echo "| Staging ZIP deployment | ${AZURE_DEPLOY_SECONDS:-n/a} |"
            echo "| Staging smoke | ${STAGING_SMOKE_SECONDS:-n/a} |"
            echo "| Slot swap | ${SLOT_SWAP_SECONDS:-n/a} |"
            echo "| Production health | ${PRODUCTION_HEALTH_SECONDS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
