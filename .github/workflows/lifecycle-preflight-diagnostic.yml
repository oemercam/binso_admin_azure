name: Read-only lifecycle preflight diagnosis

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Read-only metadata scope; test-reset includes all company IDs and dependent row/file counts'
        type: choice
        options: [ownerless, test-reset]
        default: ownerless
      approve_readonly:
        description: 'Authorize only bounded company-ID and membership-count metadata; no repair or deployment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lifecycle-preflight-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_readonly == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node
      - name: Read ownerless-company metadata without changing data
        if: ${{ inputs.scope != 'test-reset' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/single-company-preflight.mjs --diagnose-ownerless
      - name: Inventory test-reset candidates without deleting anything
        if: ${{ inputs.scope == 'test-reset' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/test-data-reset-inventory.mjs
