name: Retention Maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      apply_cleanup:
        description: Apply production cleanup (default is read-only preview)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/retention-maintenance.yml
      - scripts/retention-cleanup.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-retention-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/postgres-runner-access
        with:
          operation: open
      - name: Wait for scoped PostgreSQL connectivity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/wait-postgres.mjs
      - name: Remove expired authentication artifacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          # Preserve scheduled maintenance; pushes and unapproved manual runs only preview.
          RETENTION_DRY_RUN: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.apply_cleanup == true) }}
          AUTH_ARTIFACT_RETENTION_DAYS: "7"
          EXPIRED_SESSION_RETENTION_DAYS: "30"
        run: pnpm retention:cleanup

      - name: Remove temporary PostgreSQL runner access
        if: always()
        uses: ./.github/actions/postgres-runner-access
        with:
          operation: close
