name: Retention Maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/retention-maintenance.yml
      - scripts/retention-cleanup.mjs

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove expired authentication artifacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          AUTH_ARTIFACT_RETENTION_DAYS: "7"
          EXPIRED_SESSION_RETENTION_DAYS: "30"
        run: pnpm retention:cleanup
