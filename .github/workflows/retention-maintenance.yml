name: Retention Maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/retention-maintenance.yml
      - scripts/retention-cleanup.mjs

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove expired authentication artifacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          AUTH_ARTIFACT_RETENTION_DAYS: "7"
          EXPIRED_SESSION_RETENTION_DAYS: "30"
        run: pnpm retention:cleanup
