name: Retention Maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      apply_cleanup:
        description: Apply production cleanup (default is read-only preview)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/retention-maintenance.yml
      - scripts/retention-cleanup.mjs

permissions:
  contents: read

concurrency:
  group: operational-retention-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Remove expired authentication artifacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          # Preserve scheduled maintenance; pushes and unapproved manual runs only preview.
          RETENTION_DRY_RUN: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.apply_cleanup == true) }}
          AUTH_ARTIFACT_RETENTION_DAYS: "7"
          EXPIRED_SESSION_RETENTION_DAYS: "30"
        run: pnpm retention:cleanup
