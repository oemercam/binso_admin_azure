name: Admin dashboard diagnostic
on:
  push:
    branches: [fix/admin-portal-ux-and-contracts-20261012]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: binso_test
          POSTGRES_PASSWORD: binso_test
          POSTGRES_DB: binso_observability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U binso_test -d binso_observability_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v4
        with:
          run-id: 38232472155
          name: binso-candidate-3689852be81e01b364f1a1f50f4e74b3a8999f80
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: deploy
      - run: |
          mkdir -p "$RUNNER_TEMP/binso-candidate"
          unzip -q deploy/binso-one.zip -d "$RUNNER_TEMP/binso-candidate"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-chromium
      - run: |
          npm install --prefix "$RUNNER_TEMP/binso-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/binso-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Inspect exact failed candidate (isolated DB only)
        env:
          BINSO_OBSERVABILITY_TEST_URL: postgres://binso_test:binso_test@127.0.0.1:5432/binso_observability_test
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: chromium
          BINSO_OBSERVABILITY_OUTPUT: ${{ runner.temp }}/admin-diagnostic
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/observability-browser-test.mjs').read_text()
          first=source.index(" for(const theme of ['light','dark'])for(const width")
          last=source.index('}finally{')
          diagnostic="""
           await page.setViewportSize({width:390,height:900});await page.goto(base+'/operator');await page.waitForLoadState('networkidle');
           const alerts=await page.getByRole('alert').allTextContents();console.log('Dashboard alert text:',JSON.stringify(alerts));
           await fs.writeFile(path.join(output,'dashboard.txt'),await page.locator('body').innerText());await fs.writeFile(path.join(output,'server.txt'),logs);
           await page.screenshot({path:path.join(output,'dashboard.png'),fullPage:true});assert.deepEqual(alerts,[],'Actual dashboard errors');await context.close();
          """
          Path('scripts/admin-diagnostic-runtime.mjs').write_text(source[:first]+diagnostic+source[last:])
          PY
          node scripts/admin-diagnostic-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-dashboard-diagnostic
          path: ${{ runner.temp }}/admin-diagnostic
          retention-days: 2
