name: CI and deploy Binso One

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: binso-one-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high

      - run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_MODE: production
          NEXT_PUBLIC_SITE_URL: https://www.binso.ch

      - name: Prepare deploy artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy/app

          echo "=== Standalone server.js suchen ==="

          SERVER_FILE=".next/standalone/server.js"

          if [ ! -f "$SERVER_FILE" ]; then
            echo "ERROR: .next/standalone/server.js fehlt."
            echo "Gefundene server.js Dateien:"
            find .next/standalone -type f -name server.js | sort
            exit 1
          fi

          echo "Standalone Entry Point: $SERVER_FILE"

          cp -R .next/standalone/. deploy/app/

          mkdir -p deploy/app/.next
          cp -R .next/static deploy/app/.next/static

          if [ -d public ]; then
            cp -R public deploy/app/public
          fi

          cp package.json deploy/app/package.json
          cp pnpm-lock.yaml deploy/app/pnpm-lock.yaml

          echo "=== Production Dependencies installieren ==="

          rm -rf deploy/app/node_modules

          pnpm install \
            --dir deploy/app \
            --prod \
            --frozen-lockfile \
            --config.node-linker=hoisted

          echo "=== Runtime Checks ==="

          test -f deploy/app/server.js

          cd deploy/app

          node -e "require.resolve('next')"
          node -e "require.resolve('@swc/helpers/_/_interop_require_default')"

          echo "Next.js und @swc/helpers vorhanden."

          zip -qr ../binso-one.zip .

          echo "=== ZIP CHECK ==="
          unzip -l ../binso-one.zip | grep 'server.js'

      - uses: actions/upload-artifact@v4
        with:
          name: binso-one-production
          path: deploy/binso-one.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binso-one-production
          path: deploy

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: binso-admin-prod
          package: deploy/binso-one.zip

