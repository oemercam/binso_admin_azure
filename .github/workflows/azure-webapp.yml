name: Deploy Binso One Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: binso-one-production
  cancel-in-progress: false
env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.0.0"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NODE_ENV: production
      - name: Prepare deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp -R .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
          cd deploy && zip -qr ../binso-one.zip .
      - name: Validate standalone package
        run: |
          set -euo pipefail
          unzip -l binso-one.zip | grep 'server.js'
          rm -rf /tmp/binso-smoke && mkdir -p /tmp/binso-smoke
          unzip -q binso-one.zip -d /tmp/binso-smoke
          cd /tmp/binso-smoke
          HOSTNAME=127.0.0.1 PORT=3100 node server.js >/tmp/binso-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3100/dashboard >/tmp/binso-page.html && grep -q "Binso One" /tmp/binso-page.html; then
              echo "Standalone package smoke test passed."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/binso-server.log
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: binso-one-production
          path: binso-one.zip
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: binso-one-production
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve Azure resource group
        run: |
          RG=$(az webapp list --query "[?name=='binso-admin-prod'].resourceGroup | [0]" -o tsv)
          test -n "$RG"
          echo "AZURE_WEBAPP_RG=$RG" >> "$GITHUB_ENV"
      - name: Configure App Service runtime
        run: az webapp config set --resource-group "$AZURE_WEBAPP_RG" --name binso-admin-prod --linux-fx-version "NODE|24-lts" --startup-file "node server.js"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: binso-admin-prod
          package: binso-one.zip
          startup-command: node server.js
      - name: Restart App Service
        run: az webapp restart --resource-group "$AZURE_WEBAPP_RG" --name binso-admin-prod
      - name: Verify deployed application
        run: |
          set -euo pipefail
          URL="https://binso-admin-prod-asctesfvhnd5b6ay.switzerlandnorth-01.azurewebsites.net/dashboard"
          for attempt in {1..24}; do
            code=$(curl -L -sS -o /tmp/binso.html -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] && grep -q "Binso One" /tmp/binso.html; then
              echo "Production verification successful."
              exit 0
            fi
            echo "Attempt $attempt/24 returned HTTP $code; waiting..."
            sleep 10
          done
          cat /tmp/binso.html || true
          exit 1
