name: CI and deploy Binso One

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: binso-one-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_MODE: production
          NEXT_PUBLIC_SITE_URL: https://www.binso.ch
      - name: Prepare deploy artifact
        run: |
          mkdir -p deploy
          zip -qr deploy/binso-one.zip . -x '.git/*' 'node_modules/*' 'deploy/*'
      - uses: actions/upload-artifact@v4
        with:
          name: binso-one-production
          path: deploy/binso-one.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binso-one-production
          path: deploy
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: binso-admin-prod
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy/binso-one.zip


