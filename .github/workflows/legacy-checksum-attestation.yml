name: Controlled legacy checksum attestation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA approved for this operation
        required: true
        type: string
      apply:
        description: Explicit approval to attest exactly 16 legacy NULL checksums
        type: boolean
        default: false
      plan_sha256:
        description: Reviewed SHA256 from a prior read-only plan run at the same source SHA
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  attest:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify exact main identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/postgres-runner-access
        with:
          operation: open
      - name: Plan or apply the reviewed legacy checksum attestation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BINSO_SOURCE_SHA: ${{ inputs.source_sha }}
          BINSO_APPROVE_ATTESTATION_SHA: ${{ inputs.apply && inputs.source_sha || '' }}
          BINSO_APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = true ]; then
            node scripts/legacy-checksum-attestation.mjs --apply
          else
            node scripts/legacy-checksum-attestation.mjs
          fi
      - name: Preserve plan and transaction receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: legacy-checksum-evidence-${{ inputs.source_sha }}-${{ github.run_id }}
          path: legacy-checksum-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove temporary database access
        if: always()
        uses: ./.github/actions/postgres-runner-access
        with:
          operation: close
