name: Deploy Azure App Service

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_PRODUCTION to confirm a manual production deploy from main"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: binso-admin-prod
  AZURE_RESOURCE_GROUP: rg-binso-admin-prod
  PRODUCTION_URL: https://binso-admin-prod-asctesfvhnd5b6ay.switzerlandnorth-01.azurewebsites.net

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify production deploy target is current main
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm }}" != "DEPLOY_PRODUCTION" ]; then
              echo "::error::Manual production deploy requires exact confirmation DEPLOY_PRODUCTION."
              exit 1
            fi
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::Manual production deploys are allowed only from main."
              exit 1
            fi
          fi
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_SHA" ] || [ "$DEPLOY_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Stale production deploy blocked. Target $DEPLOY_SHA is not current main $MAIN_SHA."
            exit 1
          fi
          echo "Production deploy target verified: $DEPLOY_SHA"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm security:scan
      - name: Full dependency audit including development tooling
        run: pnpm security:scan:all
      - run: pnpm css:check
      - run: pnpm typecheck
      - run: pnpm build
        env:
          BINSO_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate immutable production security and mail configuration
        shell: bash
        env:
          BINSO_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          get_setting() {
            az webapp config appsettings list               --resource-group "$AZURE_RESOURCE_GROUP"               --name "$AZURE_WEBAPP_NAME"               --query "[?name=='$1'].value | [0]" -o tsv
          }

          OLD_MAIL_PREFIX="RE""SEND"
          OLD_BACKEND_PREFIX="SUP""ABASE"
          for retired in             "${OLD_MAIL_PREFIX}_API_KEY"             "EMAIL_DELIVERY_MODE"             "EMAIL_FROM"             "NEXT_PUBLIC_${OLD_BACKEND_PREFIX}_URL"             "NEXT_PUBLIC_${OLD_BACKEND_PREFIX}_ANON_KEY"             "${OLD_BACKEND_PREFIX}_URL"             "${OLD_BACKEND_PREFIX}_SERVICE_ROLE_KEY"             "STRIPE_PRICE_STARTER"             "STRIPE_PRICE_BUSINESS"             "STRIPE_PRICE_PROFESSIONAL"; do
            if [ -n "$(get_setting "$retired")" ]; then
              echo "::error::Retired production setting still exists: $retired. Clean it deliberately outside the deploy."
              exit 1
            fi
          done

          APP_ENCRYPTION_KEY="$(get_setting APP_ENCRYPTION_KEY)"
          if [ -z "$APP_ENCRYPTION_KEY" ]; then
            echo "::error::APP_ENCRYPTION_KEY is missing. Production deploy refuses to generate or rotate encryption keys automatically."
            exit 1
          fi
          echo "::add-mask::$APP_ENCRYPTION_KEY"

          GRAPH_TENANT_ID="$(get_setting GRAPH_TENANT_ID)"
          GRAPH_CLIENT_ID="$(get_setting GRAPH_CLIENT_ID)"
          GRAPH_CLIENT_SECRET="$(get_setting GRAPH_CLIENT_SECRET)"
          GRAPH_SENDER_USER_ID="$(get_setting GRAPH_SENDER_USER_ID)"
          OPERATOR_ENTRA_TENANT_ID="$(get_setting OPERATOR_ENTRA_TENANT_ID)"
          OPERATOR_ALLOWED_DOMAIN="$(get_setting OPERATOR_ALLOWED_DOMAIN)"

          for name in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET GRAPH_SENDER_USER_ID; do
            value="$(get_setting "$name")"
            if [ -z "$value" ]; then
              echo "::error::Microsoft Graph mail configuration is incomplete: $name is missing."
              exit 1
            fi
            echo "::add-mask::$value"
          done

          if [ "$OPERATOR_ENTRA_TENANT_ID" != "$BINSO_ENTRA_TENANT_ID" ]; then
            echo "::error::OPERATOR_ENTRA_TENANT_ID does not match the production Azure tenant."
            exit 1
          fi
          if [ "$OPERATOR_ALLOWED_DOMAIN" != "binso.ch" ]; then
            echo "::error::OPERATOR_ALLOWED_DOMAIN must be binso.ch."
            exit 1
          fi

          TOKEN_RESPONSE="$(curl -fsS --max-time 30             -X POST             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode "client_id=$GRAPH_CLIENT_ID"             --data-urlencode "client_secret=$GRAPH_CLIENT_SECRET"             --data-urlencode "scope=https://graph.microsoft.com/.default"             --data-urlencode "grant_type=client_credentials"             "https://login.microsoftonline.com/$GRAPH_TENANT_ID/oauth2/v2.0/token")"
          node -e 'const p=JSON.parse(process.argv[1]);if(!p.access_token)process.exit(1)' "$TOKEN_RESPONSE"
          echo "Production configuration validation passed without mutating settings."

      - name: Prepare standalone deploy artifact
        env:
          APP_MODE: production
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          test -f .next/standalone/server.js

          rm -rf deploy
          mkdir -p deploy/app

          cp -R .next/standalone/. deploy/app/

          mkdir -p deploy/app/.next
          cp -R .next/static deploy/app/.next/static

          if [ -d public ]; then
            cp -R public deploy/app/public
          else
            mkdir -p deploy/app/public
          fi

          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > deploy/app/public/deployment.json

          cp package.json deploy/app/package.json
          cp pnpm-lock.yaml deploy/app/pnpm-lock.yaml

          rm -rf deploy/app/node_modules

          pnpm install             --ignore-workspace             --dir deploy/app             --prod             --frozen-lockfile             --config.node-linker=hoisted

          test -f deploy/app/server.js

          cd deploy/app

          node -e "require.resolve('next')"

          PORT=3100 HOSTNAME=127.0.0.1 node server.js > /tmp/binso-standalone.log 2>&1 &
          APP_PID=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat /tmp/binso-standalone.log; fi; kill $APP_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/binso-standalone.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3100/portal > /dev/null
          curl -fsS http://127.0.0.1:3100/demo > /dev/null
          curl -fsS http://127.0.0.1:3100/dashboard > /dev/null
          curl -fsS http://127.0.0.1:3100/deployment.json | grep -q "$DEPLOY_SHA"
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/finance)" = "401"

          kill $APP_PID 2>/dev/null || true
          trap - EXIT

          zip -qr ../binso-one.zip .

          cd ..
          test -s binso-one.zip
          unzip -l binso-one.zip | grep -q 'server.js'
          sha256sum binso-one.zip > binso-one.zip.sha256

      - name: Preserve immutable production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: |
            deploy/binso-one.zip
            deploy/binso-one.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify PostgreSQL recovery readiness before migration
        shell: bash
        run: |
          set -euo pipefail
          SERVER="binso-platform-db"
          RG="$(az resource list --name "$SERVER" --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query "[0].resourceGroup" -o tsv)"
          if [ -z "$RG" ]; then
            echo "::error::Production PostgreSQL Flexible Server was not found."
            exit 1
          fi
          STATE="$(az postgres flexible-server show -g "$RG" -n "$SERVER" --query "state" -o tsv)"
          RETENTION="$(az postgres flexible-server show -g "$RG" -n "$SERVER" --query "backup.backupRetentionDays" -o tsv)"
          if [ "$STATE" != "Ready" ]; then
            echo "::error::Production PostgreSQL is not Ready."
            exit 1
          fi
          if [ -z "$RETENTION" ] || [ "$RETENTION" -lt 7 ]; then
            echo "::error::Production PostgreSQL backup retention must be at least 7 days before migration."
            exit 1
          fi
          RECOVERY_MARKER="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "### Production migration recovery marker"
            echo "- Server: $SERVER"
            echo "- Backup retention: $RETENTION days"
            echo "- Pre-migration UTC marker: $RECOVERY_MARKER"
            echo "- Deploy SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL recovery readiness passed; pre-migration marker: $RECOVERY_MARKER"

      - name: Validate and migrate Azure PostgreSQL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          EXPECTED_DATABASE_HOST: binso-platform-db.postgres.database.azure.com
          EXPECTED_DATABASE_NAME: binso_platform
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL for Azure Database for PostgreSQL is required."
            exit 1
          fi
          node scripts/check-production-migration-safety.mjs
          pnpm db:migrate
          pnpm db:check

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy/binso-one.zip

      - name: Restart Azure App Service and wait for worker convergence
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          VERSION_URL="$PRODUCTION_URL/api/health"
          CONSECUTIVE=0

          for attempt in {1..90}; do
            code=$(curl -sS -o /tmp/binso-convergence.json -w "%{http_code}" --max-time 20 -H 'Cache-Control: no-cache' "$VERSION_URL?probe=$attempt" || true)

            if [ "$code" = "200" ] && grep -q "$DEPLOY_SHA" /tmp/binso-convergence.json; then
              CONSECUTIVE=$((CONSECUTIVE+1))
              echo "Current commit observed ($CONSECUTIVE/5): $DEPLOY_SHA"
              if [ "$CONSECUTIVE" -ge 5 ]; then
                break
              fi
            else
              CONSECUTIVE=0
              echo "Waiting for all App Service workers to converge ($attempt/90)..."
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error::Azure App Service did not converge on $DEPLOY_SHA."
              cat /tmp/binso-convergence.json 2>/dev/null || true
              exit 1
            fi

            sleep 3
          done

      - name: Verify current production build and routes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          VERSION_URL="$PRODUCTION_URL/api/health"

          for attempt in {1..60}; do
            code=$(curl -sS -o /tmp/binso-version.json -w "%{http_code}" --max-time 20 -H 'Cache-Control: no-cache' "$VERSION_URL" || true)

            if [ "$code" = "200" ] && grep -q "$DEPLOY_SHA" /tmp/binso-version.json; then
              echo "Current commit is live: $DEPLOY_SHA"
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Current deployment did not become active: $VERSION_URL"
              cat /tmp/binso-version.json 2>/dev/null || true
              exit 1
            fi

            echo "Waiting for current commit to become live ($attempt/60)..."
            sleep 5
          done

          HEALTH_URL="$PRODUCTION_URL/api/health"
          curl -fsS --max-time 20 "$HEALTH_URL" | grep -q '"status":"ok"'
          curl -fsS --max-time 20 "$PRODUCTION_URL/api/health/ready" | grep -q '"status":"ready"'
          echo "Binso One production health and readiness checks passed."

          echo "Production verification is read-only; no synthetic business data is written during deploy."

          BINSO_BASE_URL="$PRODUCTION_URL" pnpm routes:css-check

          echo "Production URL: $PRODUCTION_URL"
