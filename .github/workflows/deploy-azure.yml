name: Deploy Azure App Service

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: binso-admin-prod
  AZURE_RESOURCE_GROUP: rg-binso-admin-prod
  PRODUCTION_URL: https://binso-admin-prod-asctesfvhnd5b6ay.switzerlandnorth-01.azurewebsites.net

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          BINSO_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate and migrate Azure PostgreSQL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL for Azure Database for PostgreSQL is required."
            exit 1
          fi
          pnpm db:migrate
          pnpm db:check
          pnpm retention:cleanup

      - name: Prepare standalone deploy artifact
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
          APP_MODE: production
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          test -f .next/standalone/server.js

          rm -rf deploy
          mkdir -p deploy/app

          cp -R .next/standalone/. deploy/app/

          mkdir -p deploy/app/.next
          cp -R .next/static deploy/app/.next/static

          if [ -d public ]; then
            cp -R public deploy/app/public
          else
            mkdir -p deploy/app/public
          fi

          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > deploy/app/public/deployment.json

          cp package.json deploy/app/package.json
          cp pnpm-lock.yaml deploy/app/pnpm-lock.yaml

          rm -rf deploy/app/node_modules

          pnpm install             --ignore-workspace             --dir deploy/app             --prod             --frozen-lockfile             --config.node-linker=hoisted

          test -f deploy/app/server.js

          cd deploy/app

          node -e "require.resolve('next')"

          export BINSO_SMOKE_TEST_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$BINSO_SMOKE_TEST_TOKEN"

          PORT=3100 HOSTNAME=127.0.0.1 BINSO_SMOKE_TEST_TOKEN="$BINSO_SMOKE_TEST_TOKEN" node server.js > /tmp/binso-standalone.log 2>&1 &
          APP_PID=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat /tmp/binso-standalone.log; fi; kill $APP_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/binso-standalone.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3100/portal > /dev/null
          curl -fsS http://127.0.0.1:3100/demo > /dev/null
          curl -fsS http://127.0.0.1:3100/dashboard > /dev/null
          curl -fsS http://127.0.0.1:3100/deployment.json | grep -q "$DEPLOY_SHA"
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' -H "x-binso-smoke-test: $BINSO_SMOKE_TEST_TOKEN" -d '{}' http://127.0.0.1:3100/api/demo/session | grep -q '"ok":true'
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/finance)" = "401"

          BINSO_BASE_URL=http://127.0.0.1:3100 BINSO_SMOKE_TEST_TOKEN="$BINSO_SMOKE_TEST_TOKEN" node ../../scripts/check-persistence.mjs

          kill $APP_PID 2>/dev/null || true
          trap - EXIT

          zip -qr ../binso-one.zip .

          cd ..
          test -s binso-one.zip
          unzip -l binso-one.zip | grep -q 'server.js'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure production security and mail settings
        shell: bash
        env:
          BINSO_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          get_setting() {
            az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='$1'].value | [0]" -o tsv
          }

          APP_ENCRYPTION_KEY="$(get_setting APP_ENCRYPTION_KEY)"
          if [ -z "$APP_ENCRYPTION_KEY" ]; then
            APP_ENCRYPTION_KEY="$(openssl rand -base64 48 | tr -d '\n')"
            echo "::add-mask::$APP_ENCRYPTION_KEY"
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings "APP_ENCRYPTION_KEY=$APP_ENCRYPTION_KEY" > /dev/null
            echo "Created stable APP_ENCRYPTION_KEY."
          else
            echo "::add-mask::$APP_ENCRYPTION_KEY"
            echo "APP_ENCRYPTION_KEY already configured."
          fi

          GRAPH_TENANT_ID="$(get_setting GRAPH_TENANT_ID)"
          GRAPH_CLIENT_ID="$(get_setting GRAPH_CLIENT_ID)"
          GRAPH_CLIENT_SECRET="$(get_setting GRAPH_CLIENT_SECRET)"
          GRAPH_SENDER_USER_ID="$(get_setting GRAPH_SENDER_USER_ID)"

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              "OPERATOR_ENTRA_TENANT_ID=$BINSO_ENTRA_TENANT_ID" \
              "OPERATOR_ALLOWED_DOMAIN=binso.ch" > /dev/null

          for name in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET GRAPH_SENDER_USER_ID; do
            value="$(get_setting "$name")"
            if [ -z "$value" ]; then
              echo "::error::Microsoft Graph mail configuration is incomplete: $name is missing."
              exit 1
            fi
            echo "::add-mask::$value"
          done

          TOKEN_RESPONSE="$(curl -fsS --max-time 30 \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GRAPH_CLIENT_ID" \
            --data-urlencode "client_secret=$GRAPH_CLIENT_SECRET" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            "https://login.microsoftonline.com/$GRAPH_TENANT_ID/oauth2/v2.0/token")"
          node -e 'const p=JSON.parse(process.argv[1]);if(!p.access_token)process.exit(1)' "$TOKEN_RESPONSE"
          echo "Microsoft Graph client-credentials authentication passed."

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy/binso-one.zip

      - name: Restart Azure App Service and wait for worker convergence
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          VERSION_URL="$PRODUCTION_URL/api/health"
          CONSECUTIVE=0

          for attempt in {1..90}; do
            code=$(curl -sS -o /tmp/binso-convergence.json -w "%{http_code}" --max-time 20 -H 'Cache-Control: no-cache' "$VERSION_URL?probe=$attempt" || true)

            if [ "$code" = "200" ] && grep -q "$DEPLOY_SHA" /tmp/binso-convergence.json; then
              CONSECUTIVE=$((CONSECUTIVE+1))
              echo "Current commit observed ($CONSECUTIVE/5): $DEPLOY_SHA"
              if [ "$CONSECUTIVE" -ge 5 ]; then
                break
              fi
            else
              CONSECUTIVE=0
              echo "Waiting for all App Service workers to converge ($attempt/90)..."
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error::Azure App Service did not converge on $DEPLOY_SHA."
              cat /tmp/binso-convergence.json 2>/dev/null || true
              exit 1
            fi

            sleep 3
          done

      - name: Verify current production build and routes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          VERSION_URL="$PRODUCTION_URL/api/health"

          for attempt in {1..60}; do
            code=$(curl -sS -o /tmp/binso-version.json -w "%{http_code}" --max-time 20 -H 'Cache-Control: no-cache' "$VERSION_URL" || true)

            if [ "$code" = "200" ] && grep -q "$DEPLOY_SHA" /tmp/binso-version.json; then
              echo "Current commit is live: $DEPLOY_SHA"
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Current deployment did not become active: $VERSION_URL"
              cat /tmp/binso-version.json 2>/dev/null || true
              exit 1
            fi

            echo "Waiting for current commit to become live ($attempt/60)..."
            sleep 5
          done

          HEALTH_URL="$PRODUCTION_URL/api/health"
          curl -fsS --max-time 20 "$HEALTH_URL" | grep -q '"status":"ok"'
          curl -fsS --max-time 20 "$PRODUCTION_URL/api/health/ready" | grep -q '"status":"ready"'
          echo "Binso One production health and readiness checks passed."

          curl -fsS --max-time 60 -c /tmp/binso-production-demo.cookies -X POST -d '{}' -H 'Content-Type: application/json' "$PRODUCTION_URL/api/demo/session" | grep -q '"ok":true'
          echo "Verifying demo session endpoint."
          for collection in customers customer_contacts products employees expenses documents payments; do
            echo "Verifying PostgreSQL demo collection: $collection"
            curl -fsS --max-time 20 -b /tmp/binso-production-demo.cookies "$PRODUCTION_URL/api/demo/data?collection=$collection" > /tmp/binso-production-data.json
            node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/binso-production-data.json","utf8"));if(!Array.isArray(data.items)||!data.items.length)process.exit(1)'
          done
          echo "Verifying PostgreSQL demo finance."
          curl -fsS --max-time 20 -b /tmp/binso-production-demo.cookies "$PRODUCTION_URL/api/demo/finance" > /tmp/binso-production-finance.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/binso-production-finance.json","utf8"));if(!data.payments?.length||!data.payroll?.length||!data.operatingCosts?.length)process.exit(1)'
          curl -fsS --max-time 20 -b /tmp/binso-production-demo.cookies -X DELETE "$PRODUCTION_URL/api/demo/session" > /dev/null
          echo "PostgreSQL-backed demo and finance production checks passed."

          BINSO_BASE_URL="$PRODUCTION_URL" pnpm routes:css-check

          echo "Production URL: $PRODUCTION_URL"
