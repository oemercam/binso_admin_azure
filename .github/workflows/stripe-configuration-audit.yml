name: Stripe Configuration Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stripe-configuration-audit.yml
      - scripts/stripe-configuration-audit.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate configured Stripe account and recurring prices without payments
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(mktemp)"
          chmod 600 "$SETTINGS_FILE"
          trap 'rm -f "$SETTINGS_FILE"' EXIT
          az webapp config appsettings list -g rg-binso-admin-prod -n binso-admin-prod --query "[?starts_with(name, 'STRIPE_')].{name:name,value:value}" -o json > "$SETTINGS_FILE"
          node scripts/stripe-configuration-audit.mjs "$SETTINGS_FILE"
