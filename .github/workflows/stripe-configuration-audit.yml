name: Stripe Billing Configuration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stripe-configuration-audit.yml
      - scripts/stripe-configuration-audit.mjs
      - scripts/stripe-price-migration.mjs
      - scripts/lib/stripe-price-configuration.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Map verified existing Stripe prices and audit configuration without payments
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(mktemp)"
          MAPPING_FILE="$(mktemp)"
          chmod 600 "$SETTINGS_FILE" "$MAPPING_FILE"
          trap 'rm -f "$SETTINGS_FILE" "$MAPPING_FILE"' EXIT
          az webapp config appsettings list -g rg-binso-admin-prod -n binso-admin-prod --query "[?starts_with(name, 'STRIPE_') || name == 'APP_URL'].{name:name,value:value}" -o json > "$SETTINGS_FILE"
          node scripts/stripe-price-migration.mjs "$SETTINGS_FILE" "$MAPPING_FILE"
          if node -e 'process.exit(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))).length?0:1)' "$MAPPING_FILE"; then
            az webapp config appsettings set -g rg-binso-admin-prod -n binso-admin-prod --settings "@$MAPPING_FILE" -o none
            az webapp config appsettings list -g rg-binso-admin-prod -n binso-admin-prod --query "[?starts_with(name, 'STRIPE_') || name == 'APP_URL'].{name:name,value:value}" -o json > "$SETTINGS_FILE"
          fi
          node scripts/stripe-configuration-audit.mjs "$SETTINGS_FILE"
