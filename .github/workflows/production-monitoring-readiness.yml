name: Production Monitoring Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-monitoring-readiness.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: operational-production-monitoring-readiness
  cancel-in-progress: true

jobs:
  monitoring:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Activation requires a separately verified Reader identity and main-only
    # readiness environment. Never copy Production credentials into this scope.
    environment: readiness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-readiness-azure
        with:
          client-id: ${{ vars.READINESS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.READINESS_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.READINESS_AZURE_SUBSCRIPTION_ID }}

      - name: Verify production monitoring resources
        shell: bash
        run: |
          bash scripts/production-monitoring-check.sh
