name: Production Monitoring Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-monitoring-readiness.yml

permissions:
  contents: read
  id-token: write

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production monitoring resources
        shell: bash
        run: |
          bash scripts/production-monitoring-check.sh
