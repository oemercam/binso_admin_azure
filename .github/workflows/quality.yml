# Runner recovery trigger: 2026-10-07
name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  BINSO_BUILD_SHA: ${{ github.sha }}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm security:scan
      - name: Full dependency audit including development tooling
        run: pnpm security:scan:all
      - run: pnpm css:check
      - run: pnpm typecheck
      - run: pnpm build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/binso-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/binso-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Responsive UX browser regression
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_OUTPUT: ${{ runner.temp }}/binso-ux-browser
        run: node scripts/ux-browser-test.mjs
      - name: Safari engine mobile and tablet regression
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: webkit
          BINSO_UX_DEVICE: iPhone 13
          BINSO_UX_WIDTHS: 375,430,820
          BINSO_UX_ROUTES: /zeit,/mitarbeiter/neu,/mitarbeiter/employee-one,/projekte/neu,/rechnungen/RE-TEST-1,/kunden/neu,/produkte/neu,/spesen/neu,/angebote/neu,/zahlungen/neu
          BINSO_UX_OUTPUT: ${{ runner.temp }}/binso-ux-browser/webkit
        run: node scripts/ux-browser-test.mjs
      - name: Upload responsive UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser-${{ github.sha }}
          path: ${{ runner.temp }}/binso-ux-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Package verified production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          rm -rf deploy
          mkdir -p deploy/app/.next
          cp -R .next/standalone/. deploy/app/
          # Install the locked production dependencies without pnpm symlinks.
          # ZIP extraction and Azure startup must preserve module resolution.
          rm -rf deploy/runtime
          mkdir -p deploy/runtime
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml deploy/runtime/
          pnpm --dir deploy/runtime install --prod --frozen-lockfile --config.node-linker=hoisted
          rm -rf deploy/app/node_modules
          mv deploy/runtime/node_modules deploy/app/node_modules
          rm -rf deploy/runtime
          (
            cd deploy/app
            node -e "require('next/dist/server/next.js'); require('@next/env'); require('@swc/helpers/_/_interop_require_default')"
          )
          cp -R .next/static deploy/app/.next/static
          if [ -d public ]; then cp -R public deploy/app/public; else mkdir -p deploy/app/public; fi
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > deploy/app/public/deployment.json
          cd deploy/app
          zip -qr ../binso-one.zip .
          cd ../..
          test -s deploy/binso-one.zip
          unzip -l deploy/binso-one.zip > /tmp/binso-zip-contents.txt
          grep -q 'server.js' /tmp/binso-zip-contents.txt
      - name: Smoke test exact production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/binso-production-artifact
          mkdir -p /tmp/binso-production-artifact
          unzip -q deploy/binso-one.zip -d /tmp/binso-production-artifact
          test -f /tmp/binso-production-artifact/server.js
          test -d /tmp/binso-production-artifact/node_modules
          (
            cd /tmp/binso-production-artifact
            PORT=3100 HOSTNAME=127.0.0.1 node server.js > /tmp/binso-artifact.log 2>&1 &
            echo $! > /tmp/binso-artifact.pid
          )
          ARTIFACT_PID="$(cat /tmp/binso-artifact.pid)"
          trap 'kill "$ARTIFACT_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health > /tmp/binso-artifact-health.json; then
              READY=1
              break
            fi
            if ! kill -0 "$ARTIFACT_PID" 2>/dev/null; then
              cat /tmp/binso-artifact.log
              echo "::error::Packaged production server exited before becoming ready."
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/binso-artifact.log
            echo "::error::Packaged production artifact did not become ready."
            exit 1
          fi
          grep -q "$GITHUB_SHA" /tmp/binso-production-artifact/public/deployment.json
          grep -q '"status":"ok"' /tmp/binso-artifact-health.json
          BINSO_BASE_URL=http://127.0.0.1:3100 node scripts/check-deployed-assets.mjs /tmp/binso-production-artifact
          echo "Exact production ZIP starts successfully."
      - name: Upload verified production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: binso-one-${{ github.sha }}
          path: deploy/binso-one.zip
          if-no-files-found: error
          retention-days: 2
      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/binso-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/binso-next.log
            exit 1
          fi

          ROUTES=(
            /
            /produkt
            /preise
            /login
            /registrieren
            /portal
            /portal/login
            /portal/registrieren
            /passwort-vergessen
            /passwort-zuruecksetzen
            /demo
            /offline
            /willkommen
            /dashboard
            /kunden
            /kunden/acme
            /kunden/neu
            /angebote
            /angebote/AN-2026-012
            /angebote/neu
            /rechnungen
            /rechnungen/RE-2026-019
            /rechnungen/neu
            /zahlungen
            /zahlungen/1
            /zahlungen/neu
            /produkte
            /produkte/beratung
            /produkte/neu
            /mitarbeiter
            /mitarbeiter/thomas
            /mitarbeiter/neu
            /spesen
            /spesen/1
            /spesen/neu
            /support
            /support/5832
            /support/neu
            /belege
            /benachrichtigungen
            /zeit
            /einstellungen
            /einstellungen/konto
            /einstellungen/firma
            /einstellungen/team
            /einstellungen/abonnement
            /einstellungen/benachrichtigungen
            /einstellungen/sprache
            /einstellungen/sicherheit
            /einstellungen/darstellung
            /operator
            /operator/kunden
            /operator/support
            /operator/sicherheit
            /operator/audit
            /preview/dashboard
            /preview/rechnungen
            /preview/zeit
          )

          for route in "${ROUTES[@]}"; do
            echo "Smoke: $route"
            curl -fsS "http://127.0.0.1:3000$route" > /dev/null
          done

          BINSO_BASE_URL=http://127.0.0.1:3000 pnpm routes:css-check

          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          test "$(curl -sS -o /tmp/binso-ready.json -w '%{http_code}' http://127.0.0.1:3000/api/health/ready)" = "503"
          grep -q '"status":"not_ready"' /tmp/binso-ready.json
          echo "Smoke: unauthenticated session"
          curl -fsS http://127.0.0.1:3000/api/auth/session | grep -q '"authenticated":false'
          echo "Smoke: demo session create"
          curl -fsS -c /tmp/binso-demo.cookies -X POST -H 'Content-Type: application/json' http://127.0.0.1:3000/api/demo/session | grep -q '"ok":true'
          curl -fsS -b /tmp/binso-demo.cookies http://127.0.0.1:3000/api/demo/session | grep -q '"active":true'
          curl -fsS -b /tmp/binso-demo.cookies http://127.0.0.1:3000/api/auth/session | grep -q '"demo":true'
          curl -fsS -b /tmp/binso-demo.cookies -X DELETE -H 'Content-Type: application/json' http://127.0.0.1:3000/api/demo/session | grep -q '"active":false'
          echo "Smoke: protected APIs"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/integrations/status)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/notifications)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/sessions)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"plan":"business"}' http://127.0.0.1:3000/api/billing/checkout)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/billing/webhook)" = "400"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://127.0.0.1:3000/api/demo/session)" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://127.0.0.1:3000/api/files)" = "403"
          echo "Smoke: security headers"
          curl -fsSI http://127.0.0.1:3000/dashboard | grep -qi "x-robots-tag: noindex"
          curl -fsSI http://127.0.0.1:3000/dashboard | grep -qi "cache-control: private, no-store"
          curl -fsSI http://127.0.0.1:3000/ | grep -qi "content-security-policy:"
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"name":"Binso"'
          curl -fsS http://127.0.0.1:3000/manifest-app.webmanifest | grep -q '"name":"Binso One"'
          curl -fsS http://127.0.0.1:3000/manifest-admin.webmanifest | grep -q "One Admin"
          curl -fsS http://127.0.0.1:3000/brand/icon-black.svg | grep -q "viewBox=\\\"370 430 280 340\\\""
