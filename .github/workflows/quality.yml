name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/binso-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/binso-next.log
            exit 1
          fi

          for route in / /produkt /preise /login /registrieren /passwort-vergessen /passwort-zuruecksetzen /dashboard /kunden /angebote /rechnungen /belege /benachrichtigungen /zeit /support /einstellungen /operator; do
            curl -fsS "http://127.0.0.1:3000$route" > /dev/null
          done

          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/api/auth/session | grep -q '"configured":false'
          curl -fsS -X POST -H 'Content-Type: application/json' http://127.0.0.1:3000/api/demo/session | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:3000/dashboard | grep -qi "x-robots-tag: noindex"
          curl -fsSI http://127.0.0.1:3000/dashboard | grep -qi "cache-control: private, no-store"
          curl -fsSI http://127.0.0.1:3000/ | grep -qi "content-security-policy:"
