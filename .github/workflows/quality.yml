name: Quality
run-name: "Quality • ${{ github.event_name }} • ${{ inputs.level || 'standard' }}${{ inputs.release_profile == 'development' && ' • development' || '' }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      level:
        description: QA coverage
        type: choice
        options: [standard, full]
        default: full
      release_profile:
        description: Acceptance scope (full coverage is unchanged)
        type: choice
        options: [production, development]
        default: production
  schedule:
    - cron: '23 1 * * *'
  release:
    types: [published]
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-{1}', inputs.level, inputs.release_profile) || 'automatic' }}
  # Newer PR/push checks supersede stale checks; explicit release runs queue safely.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
permissions:
  contents: read
env:
  BINSO_BUILD_SHA: ${{ github.sha }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      level: ${{ steps.scope.outputs.level }}
      routes: ${{ steps.scope.outputs.routes }}
      webkit_routes: ${{ steps.scope.outputs.webkit_routes }}
      widths: ${{ steps.scope.outputs.widths }}
      webkit_widths: ${{ steps.scope.outputs.webkit_widths }}
      interactions: ${{ steps.scope.outputs.interactions }}
      browser: ${{ steps.scope.outputs.browser }}
      browser_matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Select conservative QA scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFER_BROWSER: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'release' || inputs.level == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          LEVEL=standard
          if [ "$FORCE_FULL" = true ]; then LEVEL=full; fi
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            node scripts/qa-plan.mjs --level "$LEVEL" --base "$BASE_SHA" | tee /tmp/qa-plan.json
          else
            node scripts/qa-plan.mjs --level full | tee /tmp/qa-plan.json
          fi
          if [ "$DEFER_BROWSER" = true ]; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR: browser validation deferred until ready_for_review; static, security and build checks remain required." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat /tmp/qa-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Plan independent browser lanes
        id: lanes
        run: node scripts/quality-browser-plan.mjs /tmp/qa-plan.json
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16 # Docker Official Image; ECR mirror exceeded its data quota
        env:
          POSTGRES_USER: binso_test
          POSTGRES_PASSWORD: binso_test
          POSTGRES_DB: binso_v213_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U binso_test -d binso_v213_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm release:check
      - run: pnpm test
      - name: Fast UX compliance contracts
        # Runtime/rate-limit/demo/navigation contracts already ran in pnpm test.
        run: |
          node scripts/compliance/selftest.mjs
          node scripts/compliance/report-test.mjs
          node scripts/quality-browser-plan-test.mjs
      - name: Real isolated PostgreSQL parallel process gate
        env:
          BINSO_DB_PARALLEL_TEST_URL: postgres://binso_test:binso_test@127.0.0.1:5432/binso_v213_test
        run: |
          node scripts/postgres-parallel-test.mjs
          node scripts/auth-integrity-test.mjs --postgres
          node scripts/registration-test.mjs --postgres
      - run: pnpm lint
      - run: pnpm css:check
      - run: pnpm typecheck
      - name: Record successful scoped architecture lint evidence
        run: |
          mkdir -p evidence/static
          node --input-type=module -e 'import fs from "node:fs";import {identity} from "./scripts/compliance/identity.mjs";fs.writeFileSync("evidence/static/compliance-lint.json",JSON.stringify({schemaVersion:1,...identity(),route:"customer-app",state:"source",checks:[{id:"UX-ARC-001",status:"passed",observed:{command:"pnpm lint",exit:0,scope:"existing central-ui owner rules; full lint"}}]}));'
      - name: Upload architecture lint evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-static-${{ github.sha }}
          path: evidence/static
          if-no-files-found: error
          retention-days: 7
      - run: pnpm security:scan
      - name: Full dependency audit including development tooling
        run: pnpm security:scan:all
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16 # Docker Official Image; ECR mirror exceeded its data quota
        env:
          POSTGRES_USER: binso_test
          POSTGRES_PASSWORD: binso_test
          POSTGRES_DB: binso_v213_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U binso_test -d binso_v213_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Restore Next compiler cache (never a completed build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-
      - run: pnpm build
      - name: Authenticated tenant, role and session HTTP gate
        env:
          BINSO_DB_PARALLEL_TEST_URL: postgres://binso_test:binso_test@127.0.0.1:5432/binso_v213_test
        run: node scripts/api-tenant-postgres-test.mjs
      - name: Anonymous API authorization surface
        run: node scripts/api-auth-surface-test.mjs
      - name: Runtime smoke test
        run: bash scripts/runtime-smoke.sh
      - name: Package production candidate
        run: bash scripts/package-production.sh
      - name: Smoke test exact production artifact
        run: bash scripts/smoke-production-artifact.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binso-candidate-${{ github.sha }}
          path: deploy/binso-one.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  browser:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: binso_test
          POSTGRES_PASSWORD: binso_test
          POSTGRES_DB: binso_observability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U binso_test -d binso_observability_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    needs: [plan, build]
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # Responsive shards and functional suites use separate runners; all gate quality.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binso-candidate-${{ github.sha }}
          path: deploy
      - name: Extract exact production candidate
        run: |
          mkdir -p "$RUNNER_TEMP/binso-candidate"
          unzip -q deploy/binso-one.zip -d "$RUNNER_TEMP/binso-candidate"
      - name: Restore pinned browser binaries
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-${{ matrix.engine }}
      - name: Install one browser engine
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          npm install --prefix "$RUNNER_TEMP/binso-browser" --no-package-lock --ignore-scripts playwright@1.62.1 axe-core@4.11.0
          if [ "$ENGINE" = chromium ]; then
            node "$RUNNER_TEMP/binso-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          else
            node "$RUNNER_TEMP/binso-browser/node_modules/playwright/cli.js" install --with-deps webkit
          fi
      - name: Save installed browser binaries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-${{ matrix.engine }}
      - name: Capture owner-supplied UX reference views
        if: matrix.lane == 'functional' && matrix.engine == 'chromium'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_REFERENCE_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}
        run: node scripts/ux-reference-capture.mjs
      - name: Scroll endpoint measurement adversaries
        if: matrix.lane == 'functional'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: ${{ matrix.engine }}
        run: node scripts/compliance/measure-browser-test.mjs
      - name: Critical timer, draft recovery and report export regression
        if: matrix.lane == 'functional'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_UX_DEVICE: ${{ matrix.engine == 'webkit' && 'iPhone 13' || '' }}
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
          BINSO_UX_ROUTES: /projekte/project-one,/berichte
          BINSO_UX_WIDTHS: '390'
          BINSO_UX_THEMES: light,dark
          BINSO_UX_INTERACTIONS: time
          BINSO_UX_SCREENSHOTS: '0'
          BINSO_UX_DOM_EVIDENCE: '0'
          BINSO_UX_CAPTURE_ALL: '0'
          BINSO_UX_COMPLIANCE: '0'
          BINSO_UX_PORT: '3350'
          BINSO_UX_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/critical
        run: node scripts/ux-browser-test.mjs
      - name: Landing and portal localization regression
        if: matrix.lane == 'functional'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
          BINSO_LOCALIZATION_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/localization
        run: node scripts/localization-browser-test.mjs
      - name: Scoped responsive UX and process regression
        if: matrix.lane == 'responsive'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_AXE_MODULE: ${{ runner.temp }}/binso-browser/node_modules/axe-core/axe.min.js
          BINSO_UX_A11Y: ${{ needs.plan.outputs.level == 'full' && '1' || '0' }}
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_UX_DEVICE: ${{ matrix.engine == 'webkit' && 'iPhone 13' || '' }}
          BINSO_UX_ROUTES: ${{ matrix.engine == 'webkit' && needs.plan.outputs.webkit_routes || needs.plan.outputs.routes }}
          BINSO_UX_WIDTHS: ${{ matrix.engine == 'webkit' && needs.plan.outputs.webkit_widths || needs.plan.outputs.widths }}
          BINSO_UX_INTERACTIONS: ${{ needs.plan.outputs.interactions }}
          BINSO_UX_CI_SHARD: ${{ matrix.shard }}
          BINSO_UX_CI_SHARDS: ${{ matrix.shards }}
          BINSO_UX_SCREENSHOTS: ${{ needs.plan.outputs.level == 'full' && '1' || '0' }}
          BINSO_UX_DOM_EVIDENCE: ${{ needs.plan.outputs.level == 'full' && '1' || '0' }}
          BINSO_UX_CAPTURE_ALL: ${{ needs.plan.outputs.level == 'full' && '1' || '0' }}
          BINSO_UX_COMPLIANCE: '1'
          BINSO_UX_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
        run: node scripts/browser-shards.mjs
      - name: Deterministic synthetic data and role variants
        if: matrix.lane == 'functional' && matrix.engine == 'chromium' && needs.plan.outputs.level == 'full'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
          BINSO_UX_COMPLIANCE: '1'
          BINSO_UX_MATRIX_ONLY: '1'
          BINSO_UX_THEMES: light
          BINSO_UX_WIDTHS: '390'
          BINSO_UX_SCREENSHOTS: '0'
        shell: bash
        run: |
          set -euo pipefail
          INDEX=0
          for FIXTURE in empty large partial negative no-expenses admin finance employee; do
            ROUTES=/kunden
            case "$FIXTURE" in
              empty) ROUTES=/kunden,/finanzen ;;
              partial) ROUTES=/rechnungen ;;
              negative|no-expenses|finance) ROUTES=/finanzen ;;
              employee) ROUTES=/zeit ;;
            esac
            BINSO_UX_FIXTURE_CASE="$FIXTURE" BINSO_UX_ROUTES="$ROUTES" BINSO_UX_PORT="$((3600 + INDEX * 2))" BINSO_UX_OUTPUT="$RUNNER_TEMP/binso-ux-chromium/fixtures/$FIXTURE" node scripts/ux-browser-test.mjs
            INDEX=$((INDEX + 1))
          done
      - name: Authenticated observability and wallboard regression
        if: matrix.lane == 'functional'
        env:
          BINSO_OBSERVABILITY_TEST_URL: postgres://binso_test:binso_test@127.0.0.1:5432/binso_observability_test
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_OBSERVABILITY_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/observability
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
        run: node scripts/observability-browser-test.mjs
      - name: Guided registration, languages and responsive regression
        if: matrix.lane == 'functional'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_AXE_MODULE: ${{ runner.temp }}/binso-browser/node_modules/axe-core/axe.min.js
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_REGISTRATION_WIDTHS: ${{ matrix.engine == 'webkit' && '375,390,430' || '320,360,375,390,430,768,820,1024,1280,1440,1920' }}
          BINSO_REGISTRATION_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/registration
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
        run: node scripts/registration-browser-test.mjs
      - name: Development-only shared component reference regression
        if: matrix.engine == 'chromium' && needs.plan.outputs.level == 'full'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_LAB_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/lab
        run: pnpm ux:lab
      - name: FULL PWA restart and offline regression
        if: matrix.engine == 'chromium' && needs.plan.outputs.level == 'full'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
        run: node scripts/pwa-browser-test.mjs
      - name: Startup, session and persistent navigation regression
        if: matrix.lane == 'functional'
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_BROWSER: ${{ matrix.engine }}
          BINSO_UX_SERVER_FILE: ${{ runner.temp }}/binso-candidate/server.js
          BINSO_LOADING_OUTPUT: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}/loading
        run: node scripts/loading-browser-test.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-browser-${{ matrix.engine }}-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/binso-ux-${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 7
  ux-compliance:
    needs: [plan, checks, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Collect current browser measurements
        continue-on-error: true # Missing evidence is reported; the final quality job still blocks failed browsers.
        if: needs.plan.outputs.browser == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ux-browser-*-${{ github.sha }}
          path: evidence/ux
      - name: Collect successful architecture lint evidence
        continue-on-error: true # A failed checks job may have no artifact; coverage remains untested.
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ux-static-${{ github.sha }}
          path: evidence/ux/static
      - name: Generate individual requirement coverage and enforce measured failures
        env:
          QA_EVENT: ${{ github.event_name }}
          QA_LEVEL: ${{ inputs.level }}
          QA_RELEASE_PROFILE: ${{ inputs.release_profile || 'production' }}
          QA_REF: ${{ github.ref }}
          QA_PLANNED_LEVEL: ${{ needs.plan.outputs.level }}
          QA_BROWSER: ${{ needs.plan.outputs.browser }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS' > "$RUNNER_TEMP/qa-acceptance-flags"
          import {qaAcceptance} from './scripts/qa-acceptance.mjs';
          const decision=qaAcceptance({event:process.env.QA_EVENT,level:process.env.QA_LEVEL,profile:process.env.QA_RELEASE_PROFILE,ref:process.env.QA_REF,plannedLevel:process.env.QA_PLANNED_LEVEL,browser:process.env.QA_BROWSER==='true'});
          if(decision.release)console.log('--release');
          if(decision.deployment)console.log('--deployment-release');
          JS
          mapfile -t EXTRA < "$RUNNER_TEMP/qa-acceptance-flags"
          node scripts/compliance/visual.mjs evidence/ux ux-compliance/visual-baselines.v1.json evidence/ux/compliance-visual.json
          node scripts/compliance/report.mjs --static --gate "${EXTRA[@]}" evidence/ux --out docs/ux-compliance
      - name: Publish compliance report including failures and missing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-compliance-${{ github.sha }}
          path: docs/ux-compliance
          if-no-files-found: error
          retention-days: 30
      - name: Add coverage summary
        if: always()
        run: cat docs/ux-compliance/report.md >> "$GITHUB_STEP_SUMMARY"
  scanner-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Validate sidecar ARM template without provisioning
        run: az bicep build --file infrastructure/scanner/sidecar.bicep --stdout > "$RUNNER_TEMP/scanner-template.json"
      - name: Resolve official patched ClamAV and build private-loopback runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull clamav/clamav:1.4.6
          BASE_IMAGE="$(docker inspect clamav/clamav:1.4.6 --format '{{index .RepoDigests 0}}')"
          [[ "$BASE_IMAGE" =~ ^clamav/clamav@sha256:[a-f0-9]{64}$ ]]
          echo "BINSO_SCANNER_BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg "CLAMAV_BASE_IMAGE=$BASE_IMAGE" -t binso-scanner-qualification infrastructure/scanner
          docker run -d --name binso-scanner-qualification --network host --memory 4g --cpus 2 \
            -e DATABASE_URL=BINSO_CREDENTIAL_SENTINEL -e GRAPH_CLIENT_SECRET=BINSO_CREDENTIAL_SENTINEL \
            binso-scanner-qualification
      - name: Real engine, current signatures, limits, outage and recovery
        env:
          BINSO_SCANNER_TEST_CONTAINER: binso-scanner-qualification
          BINSO_SCANNER_OUTPUT: ${{ runner.temp }}/binso-scanner-qualification
        run: node scripts/scanner-engine-test.mjs
      - name: Export the exact qualified scanner image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/binso-scanner-image"
          docker save binso-scanner-qualification | gzip -1 > "$RUNNER_TEMP/binso-scanner-image/image.tar.gz"
          export BINSO_SCANNER_IMAGE_ID="$(docker image inspect binso-scanner-qualification --format '{{.Id}}')"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          qualification=json.loads((root/'binso-scanner-qualification/results.json').read_text())
          assert qualification['qualified'] is True
          image=root/'binso-scanner-image/image.tar.gz'
          with image.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          metadata={'schemaVersion':1,'sourceSha':os.environ['GITHUB_SHA'],'imageId':os.environ['BINSO_SCANNER_IMAGE_ID'],'archiveSha256':digest,'qualification':qualification}
          (root/'binso-scanner-image/qualified-image.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          EXPECTED_ID="$(node scripts/verify-scanner-image.mjs "$RUNNER_TEMP/binso-scanner-image" "$GITHUB_SHA")"
          docker load --input "$RUNNER_TEMP/binso-scanner-image/image.tar.gz"
          test "$(docker image inspect binso-scanner-qualification --format '{{.Id}}')" = "$EXPECTED_ID"
      - name: Upload qualified scanner candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binso-scanner-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/binso-scanner-image
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
      - name: Record scanner runtime and memory evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/binso-scanner-qualification"
          docker inspect binso-scanner-qualification --format '{{json .State}}' > "$RUNNER_TEMP/binso-scanner-qualification/container-state.json"
          docker stats --no-stream --format '{{json .}}' binso-scanner-qualification > "$RUNNER_TEMP/binso-scanner-qualification/resource-sample.json"
          docker logs binso-scanner-qualification > "$RUNNER_TEMP/binso-scanner-qualification/scanner.log" 2>&1
      - name: Upload scanner qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/binso-scanner-qualification
          retention-days: 14
      - name: Stop isolated scanner
        if: always()
        run: docker rm -f binso-scanner-qualification
  quality:
    # Keep the existing required job name. Failure, cancellation or an unexpected skip is blocking.
    needs: [plan, checks, build, browser, ux-compliance, scanner-engine]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce every mandatory result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          UX_COMPLIANCE_RESULT: ${{ needs.ux-compliance.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCANNER_RESULT: ${{ needs.scanner-engine.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_REQUIRED: ${{ needs.plan.outputs.browser }}
        run: |
          set -euo pipefail
          for result in "$PLAN_RESULT" "$CHECKS_RESULT" "$BUILD_RESULT" "$UX_COMPLIANCE_RESULT" "$SCANNER_RESULT"; do
            if [ "$result" != success ]; then echo "::error::Required job ended with $result"; exit 1; fi
          done
          if [ "$BROWSER_REQUIRED" != true ] && [ "$BROWSER_REQUIRED" != false ]; then
            echo "::error::Missing or invalid browser-scope output"; exit 1
          fi
          if [ "$BROWSER_REQUIRED" = true ]; then
            test "$BROWSER_RESULT" = success || { echo "::error::Browser checks: $BROWSER_RESULT"; exit 1; }
          else
            test "$BROWSER_RESULT" = skipped || { echo "::error::Unexpected browser result: $BROWSER_RESULT"; exit 1; }
          fi
      - name: Download fully verified production candidate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binso-candidate-${{ github.sha }}
          path: deploy
      - name: Promote verified artifact for Azure (no rebuild)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binso-one-${{ github.sha }}
          path: deploy/binso-one.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Download exact qualified scanner image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binso-scanner-candidate-${{ github.sha }}
          path: scanner-image
      - name: Promote qualified scanner for Azure (no rebuild)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binso-scanner-${{ github.sha }}
          path: scanner-image
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
