name: Azure persistence diagnostics
on:
  push:
    branches: [diagnostics/azure-runtime]
permissions:
  contents: read
  id-token: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect persistence metadata without business data or credentials
        run: |
          az webapp config appsettings list --resource-group rg-binso-admin-prod --name binso-admin-prod -o json > /tmp/binso-settings.json
          az webapp identity show --resource-group rg-binso-admin-prod --name binso-admin-prod --query type -o tsv
          npm install --prefix /tmp/binso-probe --no-package-lock --ignore-scripts pg@8.16.3 > /tmp/binso-install.log
          node <<'JS'
          const fs=require('fs'),{Client}=require('/tmp/binso-probe/node_modules/pg');
          const settings=Object.fromEntries(JSON.parse(fs.readFileSync('/tmp/binso-settings.json')).map(r=>[r.name,r.value]));
          console.log('Blob account configured',Boolean(settings.AZURE_STORAGE_ACCOUNT),'SAS configured',Boolean(settings.AZURE_STORAGE_SAS),'app mode',settings.APP_MODE==='production'?'production':'other');
          const c=new Client({connectionString:settings.DATABASE_URL,ssl:{rejectUnauthorized:true},connectionTimeoutMillis:8000,query_timeout:8000});
          (async()=>{await c.connect();
            const snapshot=await c.query("select count(*)::int n from tenant_business_state s join organizations o on o.id=s.organization_id where not o.is_demo and s.state<>'{}'::jsonb");console.log('Nonempty productive legacy snapshots',snapshot.rows[0].n);
            const constraints=await c.query("select conrelid::regclass::text as table_name,conname from pg_constraint where contype='f' and not convalidated");console.log('Unvalidated foreign keys',constraints.rows);
            await c.end();
          })().catch(e=>{console.error('Probe failed',e.code??e.name);process.exit(1)});
          JS
