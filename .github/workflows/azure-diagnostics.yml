name: Azure runtime diagnostics
on:
  push:
    branches: [diagnostics/azure-runtime]
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-runtime-diagnostics
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect runtime configuration without secrets
        run: |
          az webapp config show --resource-group rg-binso-admin-prod --name binso-admin-prod -o json > /tmp/binso-runtime-config.json
          az webapp config appsettings list --resource-group rg-binso-admin-prod --name binso-admin-prod -o json > /tmp/binso-runtime-settings.json
          python - <<'PY'
          import json,urllib.parse
          config=json.load(open('/tmp/binso-runtime-config.json'))
          settings={r['name']:r['value'] for r in json.load(open('/tmp/binso-runtime-settings.json'))}
          url=settings.get('DATABASE_URL','')
          print('runtime',config.get('linuxFxVersion'),'alwaysOn',config.get('alwaysOn'),'startup_uses_server_js','server.js' in config.get('appCommandLine',''))
          print('database_url_configured',bool(url),'postgres_scheme',urllib.parse.urlparse(url).scheme in ['postgres','postgresql'])
          for key in ['DATABASE_SSL','DATABASE_SSL_REJECT_UNAUTHORIZED','DATABASE_POOL_MAX','PORT','WEBSITE_RUN_FROM_PACKAGE']:
              value=settings.get(key,'unset')
              print(key,value if value in ['true','false','unset'] or value.isdigit() else 'configured')
          PY
      - name: Read recent container logs through Azure management
        continue-on-error: true
        run: |
          RESOURCE_ID=$(az webapp show --resource-group rg-binso-admin-prod --name binso-admin-prod --query id -o tsv)
          timeout 60 az rest --method post --url "https://management.azure.com$RESOURCE_ID/containerlogs?api-version=2026-03-15" --output-file /tmp/binso-container.log
          python - <<'PY'
          import re
          lines=open('/tmp/binso-container.log',errors='replace').read().splitlines()
          for line in lines[-150:]:
              line=re.sub(r'[a-zA-Z]+://[^\s]+','[url redacted]',line)
              line=re.sub(r'\S+@\S+','[redacted]',line)
              line=re.sub(r"'[^']*'|\"[^\"]*\"","'[redacted]'",line)
              print(line[-250:])
          PY
      - name: Compare and verify database targets without exposing credentials
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install --prefix /tmp/binso-pg-probe --no-package-lock --ignore-scripts pg@8.16.3 > /tmp/binso-pg-install.log
          node <<'JS'
          const fs=require('fs');
          const {Client}=require('/tmp/binso-pg-probe/node_modules/pg');
          const settings=Object.fromEntries(JSON.parse(fs.readFileSync('/tmp/binso-runtime-settings.json','utf8')).map(r=>[r.name,r.value]));
          const app=settings.DATABASE_URL,migration=process.env.MIGRATION_DATABASE_URL;
          console.log('application_matches_migration_url',app===migration);
          async function test(label,url){
              if(!url){console.log(label,{configured:false});return}
              console.log(label,{azurePostgresHost:new URL(url).hostname.endsWith('.postgres.database.azure.com')});
              const client=new Client({connectionString:url,ssl:{rejectUnauthorized:true},connectionTimeoutMillis:8000,query_timeout:8000,statement_timeout:8000});
              try{
                  await client.connect();
                  await client.query("select set_config('app.organization_id','00000000-0000-4000-8000-000000000099',false)");
                  const demo=await client.query("select count(*)::int n from organizations where is_demo=true and id='00000000-0000-4000-8000-000000000099'");
                  const history=await client.query("select count(*)::int n from schema_migrations");
                  console.log(label,{connected:true,demoExists:demo.rows[0].n===1,migrations:history.rows[0].n});
              }catch(error){console.log(label,{connected:false,errorCode:error.code??error.name});}
              finally{await client.end().catch(()=>{});}
          }
          (async()=>{await test('application',app);await test('migration',migration)})().catch(()=>process.exit(1));
          JS
