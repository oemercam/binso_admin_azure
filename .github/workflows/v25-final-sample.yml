name: V25 final responsive sample
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v25-final-sample.yml'
      - 'scripts/final-responsive-browser.mjs'
      - 'scripts/ux-browser-test.mjs'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: binso_test
          POSTGRES_PASSWORD: binso_test
          POSTGRES_DB: binso_observability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U binso_test -d binso_observability_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Build current application
        run: pnpm build
      - name: Install pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/binso-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/binso-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Four bounded locale samples using existing authenticated fixtures
        env:
          BINSO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/binso-browser/node_modules/playwright/index.mjs
          BINSO_UX_FINAL_SAMPLE: '1'
          BINSO_UX_THEMES: light,dark
          BINSO_UX_INTERACTIONS: final-sample
        run: |
          for locale in de en fr it; do
            BINSO_UX_FINAL_LOCALE="$locale" BINSO_UX_OUTPUT="$RUNNER_TEMP/v25-final-sample/$locale" node scripts/ux-browser-test.mjs
          done
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v25-final-sample-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/v25-final-sample
          if-no-files-found: warn
          retention-days: 2
