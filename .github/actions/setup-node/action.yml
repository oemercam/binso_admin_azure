name: Locked Node and pnpm dependencies
description: Shared Node 24 and lockfile-aware pnpm store cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
